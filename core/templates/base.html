{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'filmes/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'filmes/css/style.css' %}">
    <link rel="shortcut icon" href="{% static 'filmes/assets/favicon.ico' %}" type="image/x-icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <title>{% block titulo %} Filmes {% endblock %}</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- Header -->
    <header class="bg-dark text-white py-3 shadow">
        <div class="container text-center">
            <h1 class="h3 mb-0 d-flex justify-content-center align-items-center">
                <i class="fa-solid fa-clapperboard me-2"></i> Django MVT Filmes
            </h1>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container my-5 flex-grow-1">
        {% block conteudo %}  {% endblock conteudo %}
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5 shadow-lg">
        <div class="container d-flex justify-content-between align-items-center">
            <p class="mb-1">Desenvolvido por 
                <a href="https://github.com/samuelvbernardo" class="text-decoration-none fw-bold text-white" target="_blank" rel="noreferrer noopener">
                    Samuel Bernardo
                </a>
            </p>
            <p class="mb-0">Este projeto utiliza 
                <a href="https://www.djangoproject.com/" class="text-decoration-none fw-bold text-white" target="_blank" rel="noreferrer noopener">
                    Django
                </a>
            </p>
        </div>
    </footer>

    <script src="{% static 'filmes/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
