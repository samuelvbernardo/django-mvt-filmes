{% extends "base.html" %}

{% block conteudo %}

<div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-5 g-4 justify-content-center">
        {% for filme in filmes %}
            <div class="col d-flex align-items-stretch">
                <div class="card shadow-sm" style="width: 100%; cursor: pointer;" data-bs-toggle="modal" data-bs-target="#modalFilme{{ filme.id }}">
                    <img src="{{ filme.imagem.url }}" class="card-img-top" alt="{{ filme.titulo }}">
                    <div class="card-body d-flex flex-column text-center p-3">
                        <h6 class="card-title mt-auto mb-2 fw-bold">{{ filme.titulo }}</h6>
                        <p class="card-text small text-muted"><strong>Lançamento:</strong> {{ filme.ano_lancamento }}</p>
                    </div>
                </div>
            </div>

            <!-- Modal -->
            <div class="modal fade" id="modalFilme{{ filme.id }}" tabindex="-1" aria-labelledby="modalFilme{{ filme.id }}Label" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-dark text-white">
                            <h5 class="modal-title" id="modalFilme{{ filme.id }}Label">{{ filme.titulo }}</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
                        </div>
                        <div class="modal-body text-center">
                            <img src="{{ filme.imagem.url }}" class="img-fluid rounded mb-3" alt="{{ filme.titulo }}">
                            <p><strong>Lançamento:</strong> {{ filme.ano_lancamento }}</p>
                            <p>{{ filme.descricao }}</p>
                        </div>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock conteudo %}
